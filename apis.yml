aid: lottielab
name: Lottielab
description: >-
  Lottielab is a browser-based motion design tool for creating, editing,
  collaborating on, and shipping Lottie animations to apps and websites. It
  pairs a Figma-like editor (design and animate modes, timeline, keyframes,
  easing, motion paths) with Interactive Lotties powered by a state-machine
  engine, and a hand-off surface for developers: a lightweight open-source
  player (the @lottielab/lottie-player web component and React component,
  based on lottie-web), Livelink CDN hosting with versioning and optimisation,
  and code-export guides for Web (vanilla JS, React, Angular, Vue, Webflow,
  Framer, WordPress) and Mobile (iOS, Android, React Native). Lottielab does
  not expose a REST API; its developer surface is the client-side player SDK
  and CDN embed rather than server-side endpoints.
